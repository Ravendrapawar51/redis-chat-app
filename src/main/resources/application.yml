spring:
  application:
    name: redis-chat-app
  
  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      database: ${REDIS_DATABASE:0}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  redis:
    host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
    port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
    password: ${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
    database: ${REDIS_DATABASE:0}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.chatapp: DEBUG
    org.springframework.data.redis: INFO
