<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis Chat Application - Live WebSocket Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; font-size: 1.5rem; color: #333; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, button { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        input { flex: 1; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: 500; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        .chat-box { height: 350px; border: 1px solid #e1e4e8; border-radius: 4px; padding: 12px; overflow-y: auto; background: #fafbfc; margin-bottom: 15px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; background: #e9ecef; }
        .message.mine { background: #d1e7dd; align-self: flex-end; }
        .message .sender { font-weight: bold; font-size: 12px; color: #495057; margin-bottom: 4px; }
        .message .text { font-size: 14px; color: #212529; }
        .status { font-size: 13px; margin-bottom: 10px; }
        .status.connected { color: #28a745; }
        .status.disconnected { color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <h1>💬 Redis Chat App (Real-time WebSocket)</h1>
    <div id="status" class="status disconnected">Status: Disconnected</div>

    <div class="form-row">
        <input type="text" id="roomId" placeholder="Room ID (e.g. general)" value="general">
        <input type="text" id="participant" placeholder="Your Name" value="User1">
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="form-row">
        <input type="text" id="messageInput" placeholder="Type a message..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    let stompClient = null;
    let currentRoom = null;
    let currentParticipant = null;

    async function connect() {
        const roomId = document.getElementById('roomId').value.trim();
        const participant = document.getElementById('participant').value.trim();

        if (!roomId || !participant) {
            alert('Please enter room ID and your name');
            return;
        }

        currentRoom = roomId;
        currentParticipant = participant;

        // Step 1: Ensure room exists and user joins in Redis
        try {
            await fetch('/api/chatapp/chatrooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName: roomId })
            });
        } catch (e) {}

        try {
            await fetch('/api/chatapp/chatrooms/' + roomId + '/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ participant: participant })
            });
        } catch (e) {}

        // Step 2: Load chat history from Redis
        try {
            const historyRes = await fetch('/api/chatapp/chatrooms/' + roomId + '/messages?limit=20');
            const historyData = await historyRes.json();
            const msgs = historyData?.data?.messages || (Array.isArray(historyData?.data) ? historyData.data : []);
            document.getElementById('chatBox').innerHTML = '';
            msgs.forEach(m => showMessage(m));
        } catch (e) {
            console.log('No prior history loaded:', e);
        }

        // Step 3: Connect WebSocket STOMP
        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = console.log; // Visible in F12 console

        stompClient.connect({}, function (frame) {
            document.getElementById('status').className = 'status connected';
            document.getElementById('status').innerText = 'Connected to room: ' + currentRoom;

            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('roomId').disabled = true;
            document.getElementById('participant').disabled = true;

            // Subscribe to /topic/{roomId}
            stompClient.subscribe('/topic/' + currentRoom, function (messageOutput) {
                try {
                    const message = JSON.parse(messageOutput.body);
                    showMessage(message);
                } catch (err) {
                    console.error('Error parsing received message:', err);
                }
            });
        }, function (error) {
            document.getElementById('status').className = 'status disconnected';
            document.getElementById('status').innerText = 'Connection Error: ' + error;
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        document.getElementById('status').className = 'status disconnected';
        document.getElementById('status').innerText = 'Status: Disconnected';
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('roomId').disabled = false;
        document.getElementById('participant').disabled = false;
    }

    async function sendMessage() {
        const textInput = document.getElementById('messageInput');
        const text = textInput.value.trim();
        if (!text) return;

        const payload = {
            participant: currentParticipant,
            message: text
        };

        // Always send through REST API to guarantee Redis persistence & Pub/Sub broadcast
        try {
            const res = await fetch('/api/chatapp/chatrooms/' + currentRoom + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                // If room was missing, create and retry
                await fetch('/api/chatapp/chatrooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomName: currentRoom })
                });
                await fetch('/api/chatapp/chatrooms/' + currentRoom + '/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ participant: currentParticipant })
                });
                await fetch('/api/chatapp/chatrooms/' + currentRoom + '/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
        } catch (e) {
            console.error('REST send error, trying STOMP:', e);
            if (stompClient && stompClient.connected) {
                stompClient.send('/app/chat/' + currentRoom + '/send', {}, JSON.stringify(payload));
            }
        }

        textInput.value = '';
    }

    function showMessage(msg) {
        if (!msg || !msg.message) return;
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message' + (msg.participant === currentParticipant ? ' mine' : '');
        msgDiv.innerHTML = '<div class="sender">' + escapeHtml(msg.participant) + '</div><div class="text">' + escapeHtml(msg.message) + '</div>';
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>
</body>
</html>
